<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>Chamoix</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #faf2f4;
      --bg-soft: #f7ecee;
      --surface: #fcf7f8;
      --surface-elevated: #f5e6ea;
      --border-tone: #e8d2d8;
      --stripe-bank: #d8a7b8;
      --stripe-wallet: #e6bfcc;
      --ink-soft-black: #4a4044;
      --ink-muted: #8b747d;
      --shadow-tone: 0 8px 24px rgba(175, 130, 145, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--ink-soft-black);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px 56px;
    }

    .box-card {
      background-color: var(--surface);
      border: 1.5px solid var(--border-tone);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow-tone);
      margin-bottom: 14px;
    }

    .profile-card {
      text-align: center;
      padding-bottom: 20px;
    }

    .banner-photo {
      width: 100%;
      height: 136px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin-bottom: -44px;
      border: 2px solid var(--bg-base);
      background-color: var(--bg-soft);
    }

    .avatar-photo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg-base);
      background-color: var(--bg-soft);
      position: relative;
      z-index: 2;
      box-shadow: var(--shadow-tone);
    }

    .brand-name {
      font-size: 21px;
      font-weight: 700;
      color: var(--ink-soft-black);
      margin-top: 10px;
    }

    .music-pill {
      margin-top: 10px;
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-tone);
      background-color: var(--bg-soft);
      color: var(--ink-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .pay-slot {
      position: relative;
      background-color: var(--bg-soft);
      border: 1px solid var(--border-tone);
      border-radius: 18px;
      padding: 13px 14px 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .pay-slot:last-child {
      margin-bottom: 0;
    }

    .pay-slot.bank-slot::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background-color: var(--stripe-bank);
    }

    .pay-slot.wallet-slot::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background-color: var(--stripe-wallet);
    }

    .pay-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .pay-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pay-icon {
      width: 16px;
      height: 16px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .pay-tag {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .pay-number {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-soft-black);
      word-break: break-word;
    }

    .plain-num,
    .plain-num a,
    a[href^="tel:"] {
      color: var(--ink-soft-black) !important;
      text-decoration: none !important;
      -webkit-text-fill-color: var(--ink-soft-black) !important;
      pointer-events: none;
    }

    .copy-action {
      padding: 7px 14px;
      border-radius: 14px;
      border: 1px solid var(--border-tone);
      background-color: var(--surface-elevated);
      color: var(--ink-soft-black);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .name-box-card {
      text-align: center;
    }

    .name-heading {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }

    .name-value {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-soft-black);
    }

    .form-uniform-text {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ink-soft-black);
      text-align: center;
      margin-bottom: 12px;
      white-space: pre-line;
    }

    .amount-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1.5px solid var(--border-tone);
      background-color: var(--bg-base);
      color: var(--ink-soft-black);
      -webkit-text-fill-color: var(--ink-soft-black);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      outline: none;
      margin-bottom: 10px;
    }

    .amount-input::placeholder {
      color: var(--ink-muted);
      -webkit-text-fill-color: var(--ink-muted);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .quick-btn {
      padding: 9px 6px;
      border-radius: 14px;
      border: 1px solid var(--border-tone);
      background-color: var(--bg-soft);
      color: var(--ink-soft-black);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .qr-panel {
      background-color: var(--bg-soft);
      border: 1.5px solid var(--border-tone);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .qr-frame {
      width: 210px;
      height: 210px;
      background-color: var(--bg-base);
      border: 1px solid var(--border-tone);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .qr-frame img {
      width: 196px;
      height: 196px;
      object-fit: contain;
      display: block;
    }

    .qr-empty-note {
      font-size: 13px;
      color: var(--ink-muted);
      padding: 0 12px;
      line-height: 1.5;
    }

    .qr-meta {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft-black);
    }

    .qr-amount-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-soft-black);
    }
  </style>
</head>
<body>

  <audio
    id="bgMusic"
    loop
    autoplay
    preload="auto"
    src="https://file.garden/asG8Gt-rqWIpi3II/%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%81%E0%B8%B1%E0%B8%99%20Cover%20by%20Gemini%2C%20Fourth%20%E0%B9%81%E0%B8%9F%E0%B8%99%E0%B8%9C%E0%B8%A1%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%98%E0%B8%B2%E0%B8%99%E0%B8%99%E0%B8%B1%E0%B8%81%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%20My%20School%20President.mp3"
  ></audio>

  <div class="page-wrap">
    <div class="box-card profile-card">
      <img
        class="banner-photo"
        src="https://files.catbox.moe/93ynt8.gif"
        alt="Chamoix Banner"
      >
      <img
        class="avatar-photo"
        src="https://files.catbox.moe/k2if1a.jpeg"
        alt="Chamoix Profile"
      >
      <div class="brand-name">Chamoix</div>
      <button type="button" class="music-pill" id="musicBtn" onclick="toggleMusicManual()">play music</button>
    </div>

    <!-- กล่องบัญชีธนาคารและวอเลต พร้อมไอคอนธนาคารและกระเป๋าตังวอเลต -->
    <div class="box-card">
      <div class="pay-slot bank-slot">
        <div class="pay-info">
          <div class="pay-header">
            <svg class="pay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 10h18"></path>
              <path d="M12 3L2 9h20L12 3z"></path>
              <path d="M5 10v8"></path>
              <path d="M9.5 10v8"></path>
              <path d="M14.5 10v8"></path>
              <path d="M19 10v8"></path>
              <path d="M2 18h20"></path>
              <path d="M2 21h20"></path>
            </svg>
            <span class="pay-tag">bank ttb</span>
          </div>
          <span class="pay-number"><span class="plain-num">762 226 8618</span></span>
        </div>
        <button type="button" class="copy-action" id="copyBankBtn" onclick="copyPlainValue('7622268618', 'copyBankBtn')">คัดลอก</button>
      </div>

      <div class="pay-slot wallet-slot">
        <div class="pay-info">
          <div class="pay-header">
            <svg class="pay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path>
              <path d="M16 3H5a2 2 0 0 0-2 2v2"></path>
              <circle cx="17" cy="13.5" r="1.2" fill="currentColor"></circle>
            </svg>
            <span class="pay-tag">TrueMoney</span>
          </div>
          <span class="pay-number"><span class="plain-num">098 549 9304</span></span>
        </div>
        <button type="button" class="copy-action" id="copyWalletBtn" onclick="copyPlainValue('0985499304', 'copyWalletBtn')">คัดลอก</button>
      </div>
    </div>

    <!-- กล่องแยกสำหรับชื่อบัญชี -->
    <div class="box-card name-box-card">
      <div class="name-heading">name</div>
      <div class="name-value">maliwan thipsang</div>
    </div>

    <!-- กล่องสร้างคิวอาร์โค้ดตามยอดเงิน -->
    <div class="box-card">
      <div class="form-uniform-text">หากต้องการคิวอาร์โค๊ดสแกนให้ลูกค้ากรอกจำนวนเงินที่จะโอนได้เลยคับ แล้วรอคิวอาร์ขึ้นได้เยย🫶🏻</div>

      <input
        type="number"
        id="amountInput"
        class="amount-input"
        placeholder="0.00"
        min="0.01"
        step="0.01"
        inputmode="decimal"
        oninput="updateQrCode()"
      >

      <div class="quick-grid">
        <button type="button" class="quick-btn" onclick="addAmount(50)">+50</button>
        <button type="button" class="quick-btn" onclick="addAmount(100)">+100</button>
        <button type="button" class="quick-btn" onclick="addAmount(300)">+300</button>
        <button type="button" class="quick-btn" onclick="addAmount(500)">+500</button>
        <button type="button" class="quick-btn" onclick="addAmount(1000)">+1000</button>
        <button type="button" class="quick-btn" onclick="clearAmount()">ล้าง</button>
      </div>

      <div class="qr-panel">
        <div class="qr-frame" id="qrFrame">
          <div class="qr-empty-note" id="qrPlaceholder">กรอกจำนวนเงินเพื่อสร้างคิวอาร์โค้ด</div>
          <img id="qrImage" alt="PromptPay QR Code" style="display: none;">
        </div>
        <div class="qr-amount-label" id="qrAmountText"><span class="plain-num">0.00</span> บาท</div>
        <div class="qr-meta">พร้อมเพย์ <span class="plain-num">0902673267</span></div>
      </div>
    </div>
  </div>

  <script>
    const PROMPTPAY_ID = "0902673267";

    const audioPlayer = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");
    let audioUnlocked = false;

    function syncMusicLabel() {
      musicBtn.textContent = audioPlayer.paused ? "play music" : "playing music";
    }

    function unlockAndPlayMusic() {
      if (!audioPlayer) return;
      if (audioPlayer.paused) {
        audioPlayer.play().then(() => {
          audioUnlocked = true;
          syncMusicLabel();
        }).catch(() => {});
      } else {
        audioUnlocked = true;
        syncMusicLabel();
      }
    }

    function toggleMusicManual() {
      if (audioPlayer.paused) {
        audioPlayer.play().then(() => {
          audioUnlocked = true;
          syncMusicLabel();
        }).catch(() => {});
      } else {
        audioPlayer.pause();
        syncMusicLabel();
      }
    }

    ["pointerdown", "touchstart", "click", "scroll", "keydown"].forEach(evtName => {
      document.addEventListener(evtName, () => {
        if (!audioUnlocked) {
          unlockAndPlayMusic();
        }
      }, { passive: true });
    });

    window.addEventListener("DOMContentLoaded", () => {
      unlockAndPlayMusic();
      syncMusicLabel();
    });

    function copyPlainValue(rawText, btnId) {
      const cleanOnly = String(rawText).trim();
      const btn = document.getElementById(btnId);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cleanOnly).catch(() => fallbackCopy(cleanOnly));
      } else {
        fallbackCopy(cleanOnly);
      }

      if (btn) {
        const prev = btn.textContent;
        btn.textContent = "คัดลอกแล้ว";
        setTimeout(() => {
          btn.textContent = prev;
        }, 1200);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand("copy");
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function formatTlv(tag, value) {
      const len = String(value.length).padStart(2, "0");
      return tag + len + value;
    }

    function formatPromptPayTarget(id) {
      const digits = String(id).replace(/\D/g, "");
      if (digits.length === 13) {
        return formatTlv("02", digits);
      }
      const normalizedPhone = digits.startsWith("0") ? "0066" + digits.slice(1) : digits;
      return formatTlv("01", normalizedPhone);
    }

    function calcCrc16(payload) {
      let crc = 0xffff;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let bit = 0; bit < 8; bit++) {
          if ((crc & 0x8000) !== 0) {
            crc = ((crc << 1) ^ 0x1021) & 0xffff;
          } else {
            crc = (crc << 1) & 0xffff;
          }
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, "0");
    }

    function buildPromptPayPayload(targetId, amountNumber) {
      const formattedAmt = Number(amountNumber).toFixed(2);
      const isStatic = Number(amountNumber) <= 0;

      const versionTag = formatTlv("00", "01");
      const initiationTag = formatTlv("01", isStatic ? "11" : "12");
      const merchantAccountInfo = formatTlv(
        "29",
        formatTlv("00", "A000000677010111") + formatPromptPayTarget(targetId)
      );
      const currencyTag = formatTlv("53", "764");
      const amountTag = isStatic ? "" : formatTlv("54", formattedAmt);
      const countryTag = formatTlv("58", "TH");

      const withoutCrc =
        versionTag +
        initiationTag +
        merchantAccountInfo +
        currencyTag +
        amountTag +
        countryTag +
        "6304";

      return withoutCrc + calcCrc16(withoutCrc);
    }

    function addAmount(plusVal) {
      const input = document.getElementById("amountInput");
      const cur = parseFloat(input.value) || 0;
      const next = Math.max(0, cur + plusVal);
      input.value = Number.isInteger(next) ? String(next) : next.toFixed(2);
      updateQrCode();
    }

    function clearAmount() {
      document.getElementById("amountInput").value = "";
      updateQrCode();
    }

    function updateQrCode() {
      const input = document.getElementById("amountInput");
      const amount = parseFloat(input.value);
      const qrImg = document.getElementById("qrImage");
      const placeholder = document.getElementById("qrPlaceholder");
      const amountLabel = document.getElementById("qrAmountText");

      if (!amount || isNaN(amount) || amount <= 0) {
        qrImg.style.display = "none";
        qrImg.removeAttribute("src");
        placeholder.style.display = "block";
        amountLabel.innerHTML = `<span class="plain-num">0.00</span> บาท`;
        return;
      }

      const formatted = amount.toLocaleString("th-TH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
      amountLabel.innerHTML = `<span class="plain-num">${formatted}</span> บาท`;

      const payload = buildPromptPayPayload(PROMPTPAY_ID, amount);
      const qrApiUrl =
        "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=6&data=" +
        encodeURIComponent(payload);

      placeholder.style.display = "none";
      qrImg.style.display = "block";
      qrImg.src = qrApiUrl;
    }
  </script>
</body>
</html>
